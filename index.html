<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mecatol Rex itself, rendered from the same planet art the board uses -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070f" />
    <title>Mecatol Online</title>
    <meta
      name="description"
      content="Twilight Imperium for two players, thirty minutes. L1Z1X against the Barony of Letnev, in the browser."
    />
    <!-- The link preview WhatsApp, Slack and the rest render: the lobby's sky and title card, built by
         tools/render/render-og.html. og:image has to be absolute, and staying under ~300 KB is what keeps
         WhatsApp showing the large card instead of a thumbnail. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mecatol Online" />
    <meta property="og:title" content="Mecatol Online" />
    <meta
      property="og:description"
      content="Twilight Imperium for two players, thirty minutes. L1Z1X against the Barony of Letnev, in the browser."
    />
    <meta property="og:url" content="https://mecatol-online.vercel.app/" />
    <meta property="og:image" content="https://mecatol-online.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mecatol Online over a starfield, L1Z1X versus the Barony of Letnev" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mecatol Online" />
    <meta
      name="twitter:description"
      content="Twilight Imperium for two players, thirty minutes. L1Z1X against the Barony of Letnev, in the browser."
    />
    <meta name="twitter:image" content="https://mecatol-online.vercel.app/og.jpg" />
    <!-- the theme's Cinzel / Barlow Condensed / Barlow stack, so a visitor off macOS gets the intended
         typography instead of the CSS fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
