<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}#grid{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(3,1024px);grid-auto-rows:1024px}#grid img{display:block;width:1024px;height:1024px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search); const unit=q.get('unit')||'dreadnought';
// `style` picks the look: `b` is the cinematic three quarter view the board shipped with, `a` is the
// studio top down of the brief, a clean counter of the same miniature. Both read the same models.
const style=(q.get('style')||'b').toLowerCase();
const COLORS=[['red',0xd63b3b],['blue',0x3d7be8],['green',0x3fae5c],['yellow',0xe8c93a],['purple',0x8e5bd6],['black',0x353a48],['orange',0xf08a2c],['pink',0xe66fb0],['grey',0x9aa3ad]];
const SHIPS={dreadnought:3,flagship:3,carrier:4,cruiser:1,destroyer:2,fighter:2};
const SIZE=512, DPR=2;
const canvas=document.createElement('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(DPR); renderer.setSize(SIZE,SIZE,false);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene(); const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const tex=await new Promise(res=>new THREE.TextureLoader().load(`models/${unit}.png`,res)); tex.colorSpace=THREE.SRGBColorSpace; tex.flipY=true;
const obj=await new Promise((res,rej)=>new OBJLoader().load(`models/${unit}.obj`,res,undefined,rej));
const box=new THREE.Box3().setFromObject(obj); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3()); obj.position.sub(center);
const mat=style==='a'
  ? new THREE.MeshStandardMaterial({color:0xffffff,map:tex,aoMap:tex,aoMapIntensity:1.3,metalness:0.25,roughness:0.5,envMapIntensity:0.7})
  : new THREE.MeshStandardMaterial({color:0xffffff,map:tex,aoMap:tex,aoMapIntensity:1.1,metalness:0.6,roughness:0.35,envMapIntensity:1.1});
obj.traverse(m=>{ if(m.isMesh){ m.material=mat; m.geometry.computeVertexNormals(); if(!m.geometry.attributes.uv2) m.geometry.setAttribute('uv2',m.geometry.attributes.uv); }});
const group=new THREE.Group(); group.add(obj); group.rotation.y=Math.PI/2; scene.add(group);
if(style!=='a' && SHIPS[unit]){ const n=SHIPS[unit]; const glowMat=new THREE.MeshBasicMaterial({color:0x7fe8ff}); const sternX=box.min.x-center.x+0.06; const spread=size.z*0.28; const rad=Math.max(0.05,size.z*0.04);
  for(let i=0;i<n;i++){ const z=n===1?0:-spread+ (2*spread)*i/(n-1); const s=new THREE.Mesh(new THREE.SphereGeometry(rad,16,16),glowMat); s.position.set(sternX,-size.y*0.08,z); obj.add(s); }
  const el=new THREE.PointLight(0x66d9ff,4*Math.max(0.6,size.x/5.5),size.x*0.8,2); el.position.set(sternX-size.x*0.08,-size.y*0.06,0); obj.add(el); }
scene.add(new THREE.HemisphereLight(0xdfe8ff,0x1a2140,style==='a'?0.9:0.6));
const key=new THREE.DirectionalLight(0xfff4e0,style==='a'?1.9:1.6); key.position.set(-3,6,-3); scene.add(key);
const rim=new THREE.DirectionalLight(0xe0b45a,style==='a'?0.9:2.4); rim.position.set(4,2.2,5); scene.add(rim);
const fill=new THREE.DirectionalLight(0x6f8ee0,0.5); fill.position.set(3,-1,-4); scene.add(fill);
const r=box.getBoundingSphere(new THREE.Sphere()).radius; const R=r/Math.sin(THREE.MathUtils.degToRad(15))*1.08;
// the same framing in both styles, so a fighter stays small next to a dreadnought whichever one is picked
const frustum=2*R*Math.tan(THREE.MathUtils.degToRad(15));
let cam;
if(style==='a'){
  cam=new THREE.OrthographicCamera(-frustum/2,frustum/2,frustum/2,-frustum/2,0.1,200);
  cam.position.set(0,R,0); cam.up.set(0,0,-1); cam.lookAt(0,0,0);
}else{
  cam=new THREE.PerspectiveCamera(30,1,0.1,200);
  const elv=THREE.MathUtils.degToRad(35), az=THREE.MathUtils.degToRad(30);
  cam.position.set(-Math.sin(az)*Math.cos(elv)*R, Math.sin(elv)*R, -Math.cos(az)*Math.cos(elv)*R); cam.lookAt(0,0,0);
}
const grid=document.getElementById('grid');
for(const [name,hex] of COLORS){ mat.color.setHex(hex); renderer.render(scene,cam); const img=document.createElement('img'); img.src=canvas.toDataURL('image/png'); img.dataset.color=name; grid.appendChild(img); }
document.title=JSON.stringify({unit,style,modelLength:size.x,modelWidth:size.z,modelHeight:size.y,R,frustum,pxPerModelUnit:(SIZE*DPR)/frustum});
</script></body></html>
